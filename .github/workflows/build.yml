name: Build MineStormParty

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21', '25' ]
    name: Build with JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Maven build
        run: mvn -B -e -U clean package

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MineStormParty-JDK${{ matrix.java }}
          if-no-files-found: ignore
          path: |
            bukkit/target/MineStormParty-*.jar
            bungee/target/MineStormParty-*.jar
            velocity/target/MineStormParty-*.jar
