name: Build MineStormParty

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '7', '17', '21', '25' ]
    name: Build with JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v4

      # JDK 7 is EOL; may not be provisioned by setup-java.
      - name: Set up JDK ${{ matrix.java }}
        if: matrix.java != '7'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Set up JDK 8 (fallback for 7)
        if: matrix.java == '7'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: maven

      - name: Maven build
        run: mvn -B -e -U clean package
        continue-on-error: ${{ matrix.java == '7' }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MineStormParty-JDK${{ matrix.java }}
          if-no-files-found: ignore
          path: |
            bukkit/target/*.jar
            bungee/target/*.jar
            velocity/target/*.jar
