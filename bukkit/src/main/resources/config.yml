# ==========================================================
# MineStormParty - Configuration  |  Created by Muvixo
# ==========================================================
settings:
  party-max-size: 8
  invite-expire-seconds: 60
  disband-confirm-seconds: 15
  # /party invite <player> creates a party automatically when you have none
  auto-create-on-invite: true
  # Hide the vanilla join/quit message for players that are in a party
  suppress-public-join-quit: false
  # Cross-server relay through the BungeeCord / Velocity plugin.
  # Set to false on a standalone server (also blocks forged client messages).
  # Changing this requires a restart.
  cross-server: true

# Placeholders: %player% %leader% %color% (party color code) %message%
formats:
  member-join: "&%color%Party > &f%player% &%color%joined the Server!"
  member-quit: "&%color%Party > &f%player% &%color%left the Server!"
  party-chat: "&%color%Party > &f%player% &7\u00bb &f%message%"

placeholders:
  no-party: ""

# ============================================================
#  Database — the plugin creates the schema itself.
#  With type: mysql the database / tables / indexes are created
#  automatically on first start. You only fill in the four
#  values below. Use type: sqlite for a single-server setup.
# ============================================================
database:
  type: mysql

  # --- fill these in for MySQL ---
  host: "127.0.0.1"
  database: "minestormparty"
  username: "root"
  password: ""

  # --- optional overrides ---
  port: 3306
  useSSL: false
  serverTimezone: "UTC"
  poolSize: 10

  # --- used only when type: sqlite ---
  file: "parties.db"

  # How often each server re-reads the shared DB (seconds).
  # 0 = disabled (changes only appear on restart).
  refresh-interval-seconds: 5
